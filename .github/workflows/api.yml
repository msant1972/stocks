name: API

on:
  pull_request:
    paths: ["api/**", "db/migrations/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["api/**", "db/migrations/**", ".github/workflows/api.yml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: stocks_test
          MARIADB_USER: stocks
          MARIADB_PASSWORD: stocks
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          STOCKS_TEST_DB_PASSWORD: stocks
      - name: Contrato OpenAPI actualizado
        run: npm run openapi && git diff --exit-code openapi.yaml
