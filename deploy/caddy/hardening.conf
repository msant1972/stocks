# Reforço do serviço do Caddy (o ficheiro do pacote só tem PrivateTmp e ProtectSystem=full).
# Instalado pelo deploy/install.sh em /etc/systemd/system/caddy.service.d/ quando o Caddy está instalado.
# O Caddy só precisa de escrever os certificados (/var/lib/caddy) e os registos (/var/log/caddy) e de abrir as
# portas 80 e 443.
[Service]
NoNewPrivileges=true
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy /var/log/caddy
ProtectHome=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
UMask=0027
