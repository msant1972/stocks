# SSH do servidor da aplicação Stocks (instalado pelo deploy/install.sh em /etc/ssh/sshd_config.d/).
# O nome começa por 10- para ser lido antes dos ficheiros da imagem (50-cloud-init, 60-cloudimg): no sshd vale o
# primeiro valor encontrado. O acesso por palavra-passe mantém-se (decisão do utilizador).
#
# O root não entra directamente: entra-se como «stocks» e usa-se sudo. Quase todos os ataques visam o root.
PermitRootLogin no
# Menos tentativas por ligação e menos tempo para autenticar (o fail2ban bloqueia o IP após 5 falhas em 10 min).
MaxAuthTries 3
LoginGraceTime 30
# Sem reencaminhamento gráfico (não é usado).
X11Forwarding no
