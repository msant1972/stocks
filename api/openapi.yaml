                      trailDistance:
                        nullable: true
                        type: string
                      appPrice:
                        nullable: true
                        type: string
                      filledQuantity:
                        nullable: true
                        type: number
                      fillPrice:
                        nullable: true
                        type: string
                      finishedAt:
