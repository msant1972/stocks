  /api/v1/market/turnover:
    get:
      summary: Valor negociado diário de todos os instrumentos activos (2 anos) e a
        sua SMA200
      tags:
        - Mercado
      description: "VN de cada instrumento = volume × (abertura + mínimo + máximo +
        fecho) / 4; o valor do dia é a soma de todos. Valores em euros. A sessão
        em curso (recolha horária) não entra em `points` nem em `summary`: vem
        em `partial`."
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        value:
                          type: number
                        sma200:
                          nullable: true
                          type: number
                        instruments:
                          type: number
                      required:
                        - date
                        - value
                        - sma200
                        - instruments
                      additionalProperties: false
                  summary:
                    nullable: true
                    type: object
                    properties:
                      date:
                        type: string
                        pattern: ^\d{4}-\d{2}-\d{2}$
                        description: Data AAAA-MM-DD
                      value:
                        type: number
                      sma200:
                        nullable: true
                        type: number
                      vsSma200:
                        nullable: true
                        type: number
                    required:
                      - date
                      - value
                      - sma200
                      - vsSma200
                    additionalProperties: false
                  partial:
                    nullable: true
                    type: object
                    properties:
                      date:
                        type: string
                        pattern: ^\d{4}-\d{2}-\d{2}$
                        description: Data AAAA-MM-DD
                      value:
                        type: number
                      instruments:
                        type: number
                    required:
                      - date
                      - value
                      - instruments
                    additionalProperties: false
                  currency:
                    type: string
                    enum:
                      - EUR
                required:
                  - points
                  - summary
                  - partial
                  - currency
                additionalProperties: false
