  /api/v1/backtest:
    get:
      summary: Resultado de uma estratégia em cada instrumento, nos últimos 2 anos
      tags:
        - Estratégia
      description: "Estratégias disponíveis: a-momentum (A-Momentum: Compra 15 000 €
        quando o SMA10/SMA200 tem uma sessão «a descer» seguida de duas «a
        subir», só com o preço acima da sua média de 200 sessões (não compra
        acções em queda); reforça com mais 15 000 € sempre que o fecho sobe mais
        de 10% face à compra mais recente; vende tudo após uma «a subir» seguida
        de duas «a descer», mas só com o SMA8/SMA125 abaixo de 1%, ou, com a
        posição reforçada, quando o fecho cai mais de 15% abaixo do preço do
        último reforço. Sinais ignorados com o SMA10/SMA200 entre −1% e +1%.
        Executa ao fecho da sessão do sinal, uma posição de cada vez, sem
        comissões.) b-opus (B-Opus: Na última sessão de cada semana, sem
        posição, compra 15 000 € na abertura seguinte quando o fecho e a SMA50
        estão acima da SMA200, o M1 ((SMA10 − SMA125) / ATR22) e o M2 (momentum
        de 12 meses sem o último, dividido pela volatilidade) são positivos, o
        valor negociado médio de 50 sessões é pelo menos 5 000 000 € e não houve
        um stop nas últimas 10 sessões; não compra se a abertura subir mais de 1
        ATR face ao fecho. Reforça com mais 15 000 € na abertura seguinte sempre
        que o fecho sobe mais de 10% face ao último lote (até 5 reforços). Vende
        tudo se o preço tocar o stop chandelier (máximo desde a compra − 4 ×
        ATR22, que só sobe), ou, na revisão semanal, por falta de liquidez,
        quebra de tendência, perda de momento ou ao fim de 20 sessões sem ganhar
        1 ATR (venda na abertura seguinte). Uma posição de cada vez, sem
        comissões; indicadores sobre preços ajustados, execução a preços reais.)
        c-ai (C-AI: Sem posição, compra 15 000 € na abertura seguinte quando o
        fecho está acima da SMA200 e o M2 (momentum de 12 meses sem o último,
        dividido pela volatilidade) é positivo. Vende tudo só quando o preço
        toca o stop chandelier (máximo desde a compra − 5 × ATR22, que só sobe),
        verificado todos os dias. Reforça com mais 15 000 € na abertura seguinte
        quando o fecho sobe mais de 10% face ao último lote e o M2 é superior a
        2, até 5 reforços. Volta a comprar logo que as condições se verifiquem
        depois de um stop. Uma posição de cada vez, sem comissões; indicadores
        sobre preços ajustados, execução a preços reais.) d-reversao
        (D-Reversão: Sem posição, compra 15 000 € na abertura seguinte quando o
        fecho fica mais de 2,5 desvios-padrão abaixo da média das últimas 20
        sessões. Vende tudo na abertura seguinte quando o RSI de 2 sessões passa
        70 (ressalto) ou ao fim de 10 sessões. Sem stop nem reforços; uma
        posição de cada vez, sem comissões; indicadores sobre preços ajustados,
        execução a preços reais.) Posições abertas avaliadas ao último fecho.
        Simulação no histórico; não altera a carteira nem é recomendação."
      parameters:
        - schema:
            default: all
            type: string
            enum:
              - all
              - watchlist
          in: query
          name: scope
          required: false
        - schema:
            default: a-momentum
            type: string
            enum:
              - a-momentum
              - b-opus
              - c-ai
              - d-reversao
          in: query
          name: strategy
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategy:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      available:
                        type: boolean
                      summary:
                        type: string
                      rules:
                        type: string
                    required:
                      - id
                      - name
                      - available
                      - summary
                      - rules
                    additionalProperties: false
                  years:
                    type: number
                  budget:
                    nullable: true
                    type: number
                  computedAt:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        instrumentId:
                          type: number
                        symbol:
                          type: string
                        name:
                          nullable: true
                          type: string
                        exchange:
                          nullable: true
                          type: string
                        fromDate:
                          nullable: true
                          description: Primeira sessão com estado do momento conhecido
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                        toDate:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        sessions:
                          type: number
                        closed:
                          type: number
                        wins:
                          type: number
                        reinforcements:
                          type: number
                        openPosition:
                          type: boolean
                        peakCost:
                          type: number
                          description: Capital máximo investido em simultâneo
                        realized:
                          type: number
                          description: EUR, 2 casas
                        unrealized:
                          type: number
                          description: EUR, 2 casas
                        total:
                          type: number
                          description: EUR, 2 casas
                        totalPct:
                          type: number
                          description: Total sobre o capital máximo investido, em %
                        buyHoldPnl:
                          nullable: true
                          type: number
                          description: EUR, 2 casas
                        buyHoldPct:
                          nullable: true
                          type: number
                        investedSessions:
                          type: number
                          description: Sessões da janela com posição aberta
                        firstYear:
                          type: number
                          description: Resultado das vendas feitas no 1.º ano da janela
                        secondYear:
                          type: number
                          description: Resultado das vendas do 2.º ano e da posição aberta
                      required:
                        - instrumentId
                        - symbol
                        - name
                        - exchange
                        - fromDate
                        - toDate
                        - sessions
                        - closed
                        - wins
                        - reinforcements
                        - openPosition
