openapi: 3.0.3
info:
  title: Stocks API
  version: 1.0.0
  description: API da plataforma de simulação e acompanhamento de acções. Todas as
    operações são simuladas e usam cotações diárias, não dados em tempo real.
    Autenticação por cookie de sessão (stocks_session), obtido em POST
    /api/v1/auth/login.
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: stocks_session
  schemas: {}
paths:
  /api/v1/auth/login:
    post:
      summary: Iniciar sessão
      tags:
        - Sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  maxLength: 200
              required:
                - email
                - password
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: number
                      email:
                        type: string
                      name:
                        type: string
                      isAdmin:
                        type: boolean
                    required:
                      - id
                      - email
                      - name
                      - isAdmin
                    additionalProperties: false
                required:
                  - user
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/auth/logout:
    post:
      summary: Terminar sessão
      tags:
        - Sessão
      responses:
        "204":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
  /api/v1/me:
    get:
      summary: Utilizador autenticado
      tags:
        - Sessão
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: number
                      email:
                        type: string
                      name:
                        type: string
                      isAdmin:
                        type: boolean
                    required:
                      - id
                      - email
                      - name
                      - isAdmin
                    additionalProperties: false
                required:
                  - user
                additionalProperties: false
  /api/v1/me/password:
    put:
      summary: Alterar palavra-passe (termina todas as sessões)
      tags:
        - Sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  maxLength: 200
                newPassword:
                  type: string
                  maxLength: 200
              required:
                - currentPassword
                - newPassword
      responses:
        "204":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/instruments:
    get:
      summary: Pesquisar no catálogo global
      tags:
        - Instrumentos
      parameters:
        - schema:
            type: string
            maxLength: 64
          in: query
          name: q
          required: false
          description: Texto no símbolo ou na designação
        - schema:
            type: string
            enum:
              - pending
              - active
              - invalid
          in: query
          name: status
          required: false
        - schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
          in: query
          name: limit
          required: false
        - schema:
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
          in: query
          name: offset
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        symbol:
                          type: string
                        name:
                          nullable: true
                          type: string
                        exchange:
                          nullable: true
                          type: string
                        currency:
                          nullable: true
                          type: string
                        status:
                          type: string
                          enum:
                            - pending
                            - active
                            - invalid
                        statusReason:
                          nullable: true
                          type: string
                        firstSession:
                          nullable: true
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        lastSession:
                          nullable: true
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        inWatchlist:
                          type: boolean
                        latest:
                          nullable: true
                          type: object
                          properties:
                            date:
                              type: string
                              pattern: ^\d{4}-\d{2}-\d{2}$
                              description: Data AAAA-MM-DD
                            close:
                              type: string
                              description: 'Valor decimal em texto, ex.: "1234.50"'
                            previousDate:
                              nullable: true
                              type: string
                              pattern: ^\d{4}-\d{2}-\d{2}$
                              description: Data AAAA-MM-DD
                            previousClose:
                              nullable: true
                              type: string
                              description: 'Valor decimal em texto, ex.: "1234.50"'
                            changePct:
                              nullable: true
                              type: string
                              description: 'Valor decimal em texto, ex.: "1234.50"'
                          required:
                            - date
                            - close
                            - previousDate
                            - previousClose
                            - changePct
                          additionalProperties: false
                      required:
                        - id
                        - symbol
                        - name
                        - exchange
                        - currency
                        - status
                        - statusReason
                        - firstSession
                        - lastSession
                        - inWatchlist
                        - latest
                      additionalProperties: false
                  total:
                    type: number
                required:
                  - items
                  - total
                additionalProperties: false
    post:
      summary: Adicionar símbolos ao catálogo (validação assíncrona no fornecedor)
      tags:
        - Instrumentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbols:
                  minItems: 1
                  maxItems: 1000
                  type: array
                  items:
                    type: string
                    maxLength: 64
                addToWatchlist:
                  default: true
                  type: boolean
              required:
                - symbols
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        result:
                          type: string
                          enum:
                            - created
                            - exists
                            - error
                        message:
                          type: string
                        instrumentId:
                          nullable: true
                          type: number
                      required:
                        - symbol
                        - result
                        - message
                        - instrumentId
                      additionalProperties: false
                required:
                  - results
                additionalProperties: false
  /api/v1/instruments/fetch:
    post:
      summary: Forçar a validação no fornecedor dos instrumentos «A validar»
      tags:
        - Instrumentos
      description: "Põe os instrumentos pendentes (todos, ou os indicados) na fila sem
        espera e arranca o motor de recolha. A validação é assíncrona: o estado
        de cada instrumento muda quando o motor o processar."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instrumentIds:
                  maxItems: 1000
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                    maximum: 9007199254740991
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued:
                    type: number
                  started:
                    type: boolean
                required:
                  - queued
                  - started
                additionalProperties: false
  /api/v1/instruments/import/preview:
    post:
      summary: Pré-visualizar importação de .xlsx ou .csv (multipart, campo "file");
        não grava nada
      tags:
        - Instrumentos
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        line:
                          type: number
                        symbol:
                          type: string
                        status:
                          type: string
                          enum:
                            - new
                            - exists
                            - duplicate
                            - error
                        message:
                          type: string
                      required:
                        - line
                        - symbol
                        - status
                        - message
                      additionalProperties: false
                  summary:
                    type: object
                    properties:
                      new:
                        type: number
                      exists:
                        type: number
                      duplicate:
                        type: number
                      error:
                        type: number
                    required:
                      - new
                      - exists
                      - duplicate
                      - error
                    additionalProperties: false
                required:
                  - rows
                  - summary
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/instruments/import/template:
    get:
      summary: Modelo .xlsx para importação
      tags:
        - Instrumentos
      responses:
        "200":
          description: Default Response
  /api/v1/instruments/{id}:
    get:
      summary: Detalhe do instrumento e estado da recolha
      tags:
        - Instrumentos
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  symbol:
                    type: string
                  name:
                    nullable: true
                    type: string
                  exchange:
                    nullable: true
                    type: string
                  currency:
                    nullable: true
                    type: string
                  status:
                    type: string
                    enum:
                      - pending
                      - active
                      - invalid
                  statusReason:
                    nullable: true
                    type: string
                  firstSession:
                    nullable: true
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: Data AAAA-MM-DD
                  lastSession:
                    nullable: true
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: Data AAAA-MM-DD
                  inWatchlist:
                    type: boolean
                  latest:
                    nullable: true
                    type: object
                    properties:
                      date:
                        type: string
                        pattern: ^\d{4}-\d{2}-\d{2}$
                        description: Data AAAA-MM-DD
                      close:
                        type: string
                        description: 'Valor decimal em texto, ex.: "1234.50"'
                      previousDate:
                        nullable: true
                        type: string
                        pattern: ^\d{4}-\d{2}-\d{2}$
                        description: Data AAAA-MM-DD
                      previousClose:
                        nullable: true
                        type: string
                        description: 'Valor decimal em texto, ex.: "1234.50"'
                      changePct:
                        nullable: true
                        type: string
                        description: 'Valor decimal em texto, ex.: "1234.50"'
                    required:
                      - date
                      - close
                      - previousDate
                      - previousClose
                      - changePct
                    additionalProperties: false
                  sessions:
                    type: number
                  fetch:
                    nullable: true
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - queued
                          - running
                          - done
                          - failed
                      kind:
                        type: string
                        enum:
                          - initial
                          - incremental
                      lastError:
                        nullable: true
                        type: string
                      finishedAt:
                        nullable: true
                        type: string
                    required:
                      - status
                      - kind
                      - lastError
                      - finishedAt
                    additionalProperties: false
                required:
                  - id
                  - symbol
                  - name
                  - exchange
                  - currency
                  - status
                  - statusReason
                  - firstSession
                  - lastSession
                  - inWatchlist
                  - latest
                  - sessions
                  - fetch
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/instruments/{id}/quotes:
    get:
      summary: Cotações diárias e indicadores técnicos (por omissão, os últimos dois
        anos)
      tags:
        - Histórico
      description: ema9, sma10, sma50, sma125 e sma200 são calculados sobre o fecho
        ajustado com todo o histórico disponível; são null enquanto não houver
        sessões suficientes.
      parameters:
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          in: query
          name: from
          required: false
          description: Data AAAA-MM-DD
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          in: query
          name: to
          required: false
          description: Data AAAA-MM-DD
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  instrumentId:
                    type: number
                  symbol:
                    type: string
                  currency:
                    nullable: true
                    type: string
                  firstSession:
                    nullable: true
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: Data AAAA-MM-DD
                  lastSession:
                    nullable: true
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: Data AAAA-MM-DD
                  quotes:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        open:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        high:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        low:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        close:
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        adjClose:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        volume:
                          nullable: true
                          type: number
                        ema9:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        sma10:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        sma50:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        sma125:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        sma200:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                      required:
                        - date
                        - open
                        - high
                        - low
                        - close
                        - adjClose
                        - volume
                        - ema9
                        - sma10
                        - sma50
                        - sma125
                        - sma200
                      additionalProperties: false
                  truncated:
                    type: boolean
                required:
                  - instrumentId
                  - symbol
                  - currency
                  - firstSession
                  - lastSession
                  - quotes
                  - truncated
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/watchlist:
    get:
      summary: Instrumentos acompanhados pelo utilizador
      tags:
        - Watchlist
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        symbol:
                          type: string
                        name:
                          nullable: true
                          type: string
                        exchange:
                          nullable: true
                          type: string
                        currency:
                          nullable: true
                          type: string
                        status:
                          type: string
                          enum:
                            - pending
                            - active
                            - invalid
                        statusReason:
                          nullable: true
                          type: string
                        firstSession:
                          nullable: true
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        lastSession:
                          nullable: true
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        inWatchlist:
                          type: boolean
                        latest:
                          nullable: true
                          type: object
                          properties:
                            date:
                              type: string
                              pattern: ^\d{4}-\d{2}-\d{2}$
                              description: Data AAAA-MM-DD
                            close:
                              type: string
                              description: 'Valor decimal em texto, ex.: "1234.50"'
                            previousDate:
                              nullable: true
                              type: string
                              pattern: ^\d{4}-\d{2}-\d{2}$
                              description: Data AAAA-MM-DD
                            previousClose:
                              nullable: true
                              type: string
                              description: 'Valor decimal em texto, ex.: "1234.50"'
                            changePct:
                              nullable: true
                              type: string
                              description: 'Valor decimal em texto, ex.: "1234.50"'
                          required:
                            - date
                            - close
                            - previousDate
                            - previousClose
                            - changePct
                          additionalProperties: false
                      required:
                        - id
                        - symbol
                        - name
                        - exchange
                        - currency
                        - status
                        - statusReason
                        - firstSession
                        - lastSession
                        - inWatchlist
                        - latest
                      additionalProperties: false
                required:
                  - items
                additionalProperties: false
  /api/v1/watchlist/items:
    post:
      summary: Acompanhar um instrumento do catálogo
      tags:
        - Watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instrumentId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 9007199254740991
              required:
                - instrumentId
      responses:
        "204":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/watchlist/items/{instrumentId}:
    delete:
      summary: Deixar de acompanhar
      tags:
        - Watchlist
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: instrumentId
          required: true
      responses:
        "204":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/portfolio:
    get:
      summary: Resumo da carteira virtual e posições
      tags:
        - Carteira
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency:
                    type: string
                  initialCapital:
                    type: string
                    description: 'Valor decimal em texto, ex.: "1234.50"'
                  cashBalance:
                    type: string
                    description: 'Valor decimal em texto, ex.: "1234.50"'
                  invested:
                    type: string
                    description: 'Valor decimal em texto, ex.: "1234.50"'
                  marketValue:
                    type: string
                    description: 'Valor decimal em texto, ex.: "1234.50"'
                  totalValue:
                    type: string
                    description: 'Valor decimal em texto, ex.: "1234.50"'
                  unrealizedPnl:
                    type: string
                    description: 'Valor decimal em texto, ex.: "1234.50"'
                  realizedPnl:
                    type: string
                    description: 'Valor decimal em texto, ex.: "1234.50"'
                  totalPnl:
                    type: string
                    description: 'Valor decimal em texto, ex.: "1234.50"'
                  totalPnlPct:
                    type: string
                    description: 'Valor decimal em texto, ex.: "1234.50"'
                  valuationDate:
                    nullable: true
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: Data AAAA-MM-DD
                  positions:
                    type: array
                    items:
                      type: object
                      properties:
                        instrumentId:
                          type: number
                        symbol:
                          type: string
                        name:
                          nullable: true
                          type: string
                        exchange:
                          nullable: true
                          type: string
                        quantity:
                          type: number
                        averageCost:
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        costBasis:
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        price:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        quoteDate:
                          nullable: true
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        marketValue:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
                        unrealizedPnl:
                          nullable: true
                          type: string
                          description: 'Valor decimal em texto, ex.: "1234.50"'
