openapi: 3.0.3
info:
  title: Stocks API
  version: 1.0.0
  description: API da plataforma de simulação e acompanhamento de acções. Todas as
    operações são simuladas e usam cotações diárias (durante a sessão, um valor
    provisório actualizado de hora a hora), não dados em tempo real.
    Autenticação por cookie de sessão (stocks_session), obtido em POST
    /api/v1/auth/login.
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: stocks_session
  schemas: {}
paths:
  /api/v1/auth/login:
    post:
      summary: "Iniciar sessão (1.º passo: palavra-passe)"
      tags:
        - Sessão
      description: 'Cria uma sessão restrita de 15 minutos. O passo seguinte é
        indicado em mfa.pending: "verify" (POST /auth/mfa/verify) ou "setup"
        (POST /auth/mfa/setup e /auth/mfa/enable).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  maxLength: 200
              required:
                - email
                - password
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: number
                      email:
                        type: string
                      name:
                        type: string
                      isAdmin:
                        type: boolean
                    required:
                      - id
                      - email
                      - name
                      - isAdmin
                    additionalProperties: false
                  mfa:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      pending:
                        nullable: true
                        type: string
                        enum:
                          - verify
                          - setup
                    required:
                      - enabled
                      - pending
                    additionalProperties: false
                required:
                  - user
                  - mfa
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/auth/mfa/verify:
    post:
      summary: "Iniciar sessão (2.º passo: código da aplicação ou de recuperação)"
      tags:
        - Sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 20
              required:
                - code
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: number
                      email:
                        type: string
                      name:
                        type: string
                      isAdmin:
                        type: boolean
                    required:
                      - id
                      - email
                      - name
                      - isAdmin
                    additionalProperties: false
                  mfa:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      pending:
                        nullable: true
                        type: string
                        enum:
                          - verify
                          - setup
                    required:
                      - enabled
                      - pending
                    additionalProperties: false
                  recoveryCodesLeft:
                    nullable: true
                    type: number
                required:
                  - user
                  - mfa
                  - recoveryCodesLeft
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/auth/mfa/setup:
    post:
      summary: Gerar o segredo TOTP e o QR code (ainda por confirmar)
      tags:
        - Sessão
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  otpauthUri:
                    type: string
                  qrCode:
                    type: string
                required:
                  - secret
                  - otpauthUri
                  - qrCode
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/auth/mfa/enable:
    post:
      summary: Confirmar o 1.º código e activar o 2.º factor
      tags:
        - Sessão
      description: Devolve 10 códigos de recuperação, mostrados só desta vez. Termina
        as outras sessões do utilizador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 20
              required:
                - code
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: number
                      email:
                        type: string
                      name:
                        type: string
                      isAdmin:
                        type: boolean
                    required:
                      - id
                      - email
                      - name
                      - isAdmin
                    additionalProperties: false
                  mfa:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      pending:
                        nullable: true
                        type: string
                        enum:
                          - verify
                          - setup
                    required:
                      - enabled
                      - pending
                    additionalProperties: false
                  recoveryCodes:
                    type: array
                    items:
                      type: string
                required:
                  - user
                  - mfa
                  - recoveryCodes
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/auth/logout:
    post:
      summary: Terminar sessão
      tags:
        - Sessão
      responses:
        "204":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
  /api/v1/me:
    get:
      summary: Utilizador autenticado e estado do 2.º factor
      tags:
        - Sessão
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: number
                      email:
                        type: string
                      name:
                        type: string
                      isAdmin:
                        type: boolean
                    required:
                      - id
                      - email
                      - name
                      - isAdmin
                    additionalProperties: false
                  mfa:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      pending:
                        nullable: true
                        type: string
                        enum:
                          - verify
                          - setup
                    required:
                      - enabled
                      - pending
                    additionalProperties: false
                required:
                  - user
                  - mfa
                additionalProperties: false
  /api/v1/me/mfa:
    get:
      summary: Autenticação em dois passos da conta
      tags:
        - Sessão
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  enabledAt:
                    nullable: true
                    type: string
                  recoveryCodesLeft:
                    type: number
                required:
                  - enabled
                  - enabledAt
                  - recoveryCodesLeft
                additionalProperties: false
  /api/v1/me/mfa/recovery-codes:
    post:
      summary: Gerar códigos de recuperação novos (invalida os anteriores)
      tags:
        - Sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 20
              required:
                - code
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
                required:
                  - recoveryCodes
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/me/mfa/reset:
    post:
      summary: Trocar de aplicação de autenticação
      tags:
        - Sessão
      description: Pede a palavra-passe e um código. Desliga o 2.º factor, termina
        todas as sessões e devolve uma sessão restrita para o configurar de
        novo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  maxLength: 200
                code:
                  type: string
                  minLength: 6
                  maxLength: 20
              required:
                - password
                - code
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: number
                      email:
                        type: string
                      name:
                        type: string
                      isAdmin:
                        type: boolean
                    required:
                      - id
                      - email
                      - name
                      - isAdmin
                    additionalProperties: false
                  mfa:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      pending:
                        nullable: true
                        type: string
                        enum:
                          - verify
                          - setup
                    required:
                      - enabled
                      - pending
                    additionalProperties: false
                required:
                  - user
                  - mfa
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/me/password:
    put:
      summary: Alterar palavra-passe (termina todas as sessões)
      tags:
        - Sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  maxLength: 200
                newPassword:
                  type: string
                  maxLength: 200
              required:
                - currentPassword
                - newPassword
      responses:
        "204":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/instruments:
    get:
      summary: Pesquisar no catálogo global
      tags:
        - Instrumentos
      parameters:
        - schema:
            type: string
            maxLength: 64
          in: query
          name: q
          required: false
          description: Texto no símbolo ou na designação
        - schema:
            type: string
            enum:
              - pending
              - active
              - invalid
          in: query
          name: status
          required: false
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          in: query
          name: withIsinMic
          required: false
          description: Só instrumentos com ISIN-MIC (livro de ofertas)
        - schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 500
          in: query
          name: limit
          required: false
        - schema:
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
          in: query
          name: offset
          required: false
        - schema:
            default: symbol
            type: string
            enum:
              - symbol
              - volume
              - change
          in: query
          name: sort
          required: false
          description: symbol, volume ou change (variação da última sessão); sem valor
            ficam no fim
        - schema:
            type: string
            enum:
              - asc
              - desc
          in: query
          name: dir
          required: false
          description: por omissão asc para symbol e desc para os restantes
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        symbol:
                          type: string
                        name:
                          nullable: true
                          type: string
                        exchange:
                          nullable: true
                          type: string
                        currency:
                          nullable: true
                          type: string
                        status:
                          type: string
                          enum:
                            - pending
                            - active
                            - invalid
                        statusReason:
                          nullable: true
                          type: string
                        firstSession:
                          nullable: true
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        lastSession:
                          nullable: true
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        inWatchlist:
                          type: boolean
                        isinMic:
                          nullable: true
                          description: "ISIN-MIC Euronext, ex.: PTFCP0AM0008-XLIS (livro de ofertas)"
                          type: string
                        suggestedMic:
                          nullable: true
                          description: MIC Euronext deduzido da bolsa, se aplicável
                          type: string
                        latest:
                          nullable: true
                          type: object
                          properties:
                            date:
                              type: string
                              pattern: ^\d{4}-\d{2}-\d{2}$
                              description: Data AAAA-MM-DD
                            close:
                              type: string
                              description: 'Valor decimal em texto, ex.: "1234.50"'
                            volume:
                              nullable: true
                              description: Volume da última sessão
                              type: number
                            previousDate:
                              nullable: true
                              type: string
                              pattern: ^\d{4}-\d{2}-\d{2}$
                              description: Data AAAA-MM-DD
                            previousClose:
                              nullable: true
                              type: string
                              description: 'Valor decimal em texto, ex.: "1234.50"'
                            changePct:
                              nullable: true
                              type: string
                              description: 'Valor decimal em texto, ex.: "1234.50"'
                          required:
                            - date
                            - close
                            - volume
                            - previousDate
                            - previousClose
                            - changePct
                          additionalProperties: false
                      required:
                        - id
                        - symbol
                        - name
                        - exchange
                        - currency
                        - status
                        - statusReason
                        - firstSession
                        - lastSession
                        - inWatchlist
                        - isinMic
                        - suggestedMic
                        - latest
                      additionalProperties: false
                  total:
                    type: number
                required:
                  - items
                  - total
                additionalProperties: false
    post:
      summary: Adicionar símbolos ao catálogo (validação assíncrona no fornecedor)
      tags:
        - Instrumentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbols:
                  minItems: 1
                  maxItems: 1000
                  type: array
                  items:
                    type: string
                    maxLength: 64
                addToWatchlist:
                  default: true
                  type: boolean
                isinMics:
                  description: 'ISIN-MIC por símbolo, ex.: { "GALP.LS": "PTGAL0AM0009-XLIS" }'
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 32
              required:
                - symbols
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        result:
                          type: string
                          enum:
                            - created
                            - exists
                            - error
                        message:
                          type: string
                        instrumentId:
                          nullable: true
                          type: number
                      required:
                        - symbol
                        - result
                        - message
                        - instrumentId
                      additionalProperties: false
                required:
                  - results
                additionalProperties: false
  /api/v1/instruments/fetch:
    post:
      summary: Forçar a validação no fornecedor dos instrumentos «A validar»
      tags:
        - Instrumentos
      description: "Põe os instrumentos pendentes (todos, ou os indicados) na fila sem
        espera e arranca o motor de recolha. A validação é assíncrona: o estado
        de cada instrumento muda quando o motor o processar."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instrumentIds:
                  maxItems: 1000
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                    maximum: 9007199254740991
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued:
                    type: number
                  started:
                    type: boolean
                required:
                  - queued
                  - started
                additionalProperties: false
  /api/v1/instruments/import/preview:
    post:
      summary: Pré-visualizar importação de .xlsx ou .csv (multipart, campo "file");
        não grava nada
      tags:
        - Instrumentos
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        line:
                          type: number
                        symbol:
                          type: string
                        isinMic:
                          nullable: true
                          type: string
                        status:
                          type: string
                          enum:
                            - new
                            - exists
                            - duplicate
                            - error
                        message:
                          type: string
                      required:
                        - line
                        - symbol
                        - isinMic
                        - status
                        - message
                      additionalProperties: false
                  summary:
                    type: object
                    properties:
                      new:
                        type: number
                      exists:
                        type: number
                      duplicate:
                        type: number
                      error:
                        type: number
                    required:
                      - new
                      - exists
                      - duplicate
                      - error
                    additionalProperties: false
                required:
                  - rows
                  - summary
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/instruments/import/template:
    get:
      summary: Modelo .xlsx para importação
      tags:
        - Instrumentos
      responses:
        "200":
          description: Default Response
  /api/v1/instruments/{id}/profile:
    get:
      summary: "Perfil da empresa (actividade, indicadores e contas anuais; fonte:
        Yahoo)"
      tags:
        - Instrumentos
      description: Recolhido pelo motor de recolha uma vez por semana e na carga
        inicial. `profile` é null enquanto não houver dados. dividendYield e
        debtToEquity vêm em percentagem; profitMargin e returnOnEquity em
        fracção. Os campos de topo são os da recolha; `live` dá a capitalização,
        os P/E, o P/VC e o dividendo ao último preço, o intervalo de 52 semanas
        alargado até ele, os resultados por acção de cada P/E e o ano fiscal da
        estimativa.
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    nullable: true
                    type: object
