                        - instruments
                      additionalProperties: false
                  summary:
                    nullable: true
                    type: object
                    properties:
                      date:
                        type: string
                        pattern: ^\d{4}-\d{2}-\d{2}$
                        description: Data AAAA-MM-DD
                      value:
                        type: number
                      sma200:
                        nullable: true
                        type: number
                      vsSma200:
                        nullable: true
                        type: number
                    required:
                      - date
                      - value
                      - sma200
                      - vsSma200
                    additionalProperties: false
                  partial:
                    nullable: true
                    type: object
                    properties:
                      date:
                        type: string
                        pattern: ^\d{4}-\d{2}-\d{2}$
                        description: Data AAAA-MM-DD
                      value:
                        type: number
                      instruments:
                        type: number
                    required:
