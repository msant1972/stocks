  /api/v1/signals:
    get:
      summary: Sinais de uma estratégia em todos os instrumentos (últimas N sessões)
      tags:
        - Sinais
      description: "Estratégias: a-momentum (A-Momentum: Compra 15 000 € quando o
        SMA10/SMA200 tem uma sessão «a descer» seguida de duas «a subir», só com
        o preço acima da sua média de 200 sessões (não compra acções em queda);
        reforça com mais 15 000 € sempre que o fecho sobe mais de 10% face à
        compra mais recente; vende tudo após uma «a subir» seguida de duas «a
        descer», mas só com o SMA8/SMA125 abaixo de 1%, ou, com a posição
        reforçada, quando o fecho cai mais de 15% abaixo do preço do último
        reforço. Sinais ignorados com o SMA10/SMA200 entre −1% e +1%. Executa ao
        fecho da sessão do sinal, uma posição de cada vez, sem comissões.)
        b-opus (B-Opus: Na última sessão de cada semana, sem posição, compra
        15 000 € na abertura seguinte quando o fecho e a SMA50 estão acima da
        SMA200, o M1 ((SMA10 − SMA125) / ATR22) e o M2 (momentum de 12 meses sem
        o último, dividido pela volatilidade) são positivos, o valor negociado
        médio de 50 sessões é pelo menos 5 000 000 € e não houve um stop nas
        últimas 10 sessões; não compra se a abertura subir mais de 1 ATR face ao
        fecho. Reforça com mais 15 000 € na abertura seguinte sempre que o fecho
        sobe mais de 10% face ao último lote (até 5 reforços). Vende tudo se o
        preço tocar o stop chandelier (máximo desde a compra − 4 × ATR22, que só
        sobe), ou, na revisão semanal, por falta de liquidez, quebra de
        tendência, perda de momento ou ao fim de 20 sessões sem ganhar 1 ATR
        (venda na abertura seguinte). Uma posição de cada vez, sem comissões;
        indicadores sobre preços ajustados, execução a preços reais.) c-ai
        (C-AI: Sem posição, compra 15 000 € na abertura seguinte quando o fecho
        está acima da SMA200 e o M2 (momentum de 12 meses sem o último, dividido
        pela volatilidade) é positivo. Vende tudo só quando o preço toca o stop
        chandelier (máximo desde a compra − 5 × ATR22, que só sobe), verificado
        todos os dias. Reforça com mais 15 000 € na abertura seguinte quando o
        fecho sobe mais de 10% face ao último lote e o M2 é superior a 2, até 5
        reforços. Volta a comprar logo que as condições se verifiquem depois de
        um stop. Uma posição de cada vez, sem comissões; indicadores sobre
        preços ajustados, execução a preços reais.) d-reversao (D-Reversão: Sem
        posição, compra 15 000 € na abertura seguinte quando o fecho fica mais
        de 2,5 desvios-padrão abaixo da média das últimas 20 sessões. Vende tudo
        na abertura seguinte quando o RSI de 2 sessões passa 70 (ressalto) ou ao
        fim de 10 sessões. Sem stop nem reforços; uma posição de cada vez, sem
        comissões; indicadores sobre preços ajustados, execução a preços reais.)
        Simulação; não são recomendações."
      parameters:
        - schema:
            default: 5
            type: integer
            minimum: 1
            maximum: 20
          in: query
          name: sessions
          required: false
        - schema:
            default: a-momentum
            type: string
            enum:
              - a-momentum
              - b-opus
              - c-ai
              - d-reversao
          in: query
          name: strategy
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategy:
                    type: string
                  sessions:
                    type: number
                  latestSession:
                    nullable: true
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: Data AAAA-MM-DD
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        instrumentId:
                          type: number
                        symbol:
                          type: string
                        name:
                          nullable: true
                          type: string
                        side:
                          type: string
                          enum:
                            - buy
                            - add
                            - sell
                        reason:
                          nullable: true
                          description: "Motivo da venda (ex.: stop, trend_break), quando a estratégia o
                            indica"
                          type: string
                        date:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        sessionsAgo:
                          type: number
                        price:
                          type: string
                          description: Preço real da operação simulada (fecho na A-Momentum; abertura ou
                            stop na B-Opus)
                        lastClose:
                          type: string
                        lastDate:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: Data AAAA-MM-DD
                        changeSincePct:
                          type: string
                          description: Variação do fecho real desde o sinal, em %
                        momentumPct:
                          nullable: true
                          description: SMA10/SMA200 − 1 na última sessão, em %
                          type: string
                      required:
                        - instrumentId
                        - symbol
                        - name
                        - side
                        - reason
                        - date
                        - sessionsAgo
                        - price
                        - lastClose
                        - lastDate
                        - changeSincePct
                        - momentumPct
                      additionalProperties: false
                required:
                  - strategy
                  - sessions
                  - latestSession
                  - items
                additionalProperties: false
