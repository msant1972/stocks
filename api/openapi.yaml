  /api/v1/saxo/orders:
    post:
      summary: Enviar uma ordem para a SAXO Bank
      tags:
        - SAXO
      description: "Envio directo: a API aplica as verificações (instrumento,
        negociável, tipo de ordem, passo de preço, stop, quantidade) e a SAXO
        valida a ordem ao recebê-la; uma recusa fica com o estado rejected e a
        mensagem da SAXO. Opcionalmente, `confirmation` de POST
        /saxo/orders/preview liga o envio aos parâmetros pré-validados; na conta
        real é obrigatório (409 SAXO_CONFIRMATION_REQUIRED). Várias
        correspondências: 409 SAXO_AMBIGUOUS com os candidatos. Repetir a
        idempotencyKey devolve a ordem original."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instrumentId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                side:
                  type: string
                  enum:
                    - buy
                    - sell
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10000000
                orderType:
                  type: string
                  enum:
                    - market
                    - limit
                limitPrice:
                  description: Obrigatório nas ordens limitadas
                  type: string
                  pattern: ^\d+(\.\d{1,6})?$
                stop:
                  description: "Só nas compras: ordem de venda de protecção, activa quando a
                    compra é executada"
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - stop
                        - trailing
                      description: "stop: fixo (price); trailing: móvel (distance abaixo do mercado)"
                    price:
                      type: string
                      pattern: ^\d+(\.\d{1,6})?$
                    distance:
                      type: string
                      pattern: ^\d+(\.\d{1,6})?$
                  required:
                    - type
                confirmation:
                  type: string
                  minLength: 10
                  maxLength: 200
                idempotencyKey:
                  type: string
                  minLength: 8
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]+$
              required:
                - instrumentId
                - side
                - quantity
                - orderType
                - idempotencyKey
