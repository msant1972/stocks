[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stocks-fetcher"
version = "0.1.0"
description = "Motor de recolha de cotações diárias (yfinance → MariaDB)"
requires-python = ">=3.11"
dependencies = [
  "yfinance==1.7.0",
  "PyMySQL==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
stocks-fetcher = "fetcher.__main__:main"

[tool.setuptools]
packages = ["fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
